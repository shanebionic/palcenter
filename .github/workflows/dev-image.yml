name: Development Docker Image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish development Docker image
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Require dev branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/dev" ]]; then
            echo "::error::Development images may only be published from the dev branch."
            exit 1
          fi

      - name: Require successful validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..80}; do
            validation="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow validation.yml \
                --branch dev \
                --commit "${GITHUB_SHA}" \
                --event push \
                --limit 1 \
                --json status,conclusion
            )"
            status="$(jq -r '.[0].status // "pending"' <<< "${validation}")"
            conclusion="$(jq -r '.[0].conclusion // ""' <<< "${validation}")"

            if [[ "${status}" == "completed" && "${conclusion}" == "success" ]]; then
              echo "Validation succeeded for ${GITHUB_SHA}."
              exit 0
            fi
            if [[ "${status}" == "completed" ]]; then
              echo "::error::Validation completed with '${conclusion}' for ${GITHUB_SHA}; the development image will not be published."
              exit 1
            fi

            echo "Waiting for Validation (${status}, attempt ${attempt}/80)..."
            sleep 15
          done

          echo "::error::Timed out waiting for Validation to complete for ${GITHUB_SHA}."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate development build metadata
        id: build
        shell: bash
        run: |
          release_version="$(git tag --list 'v*.*.*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [[ -z "$release_version" ]]; then
            release_version="v$(node -p "require('./package.json').version")"
          fi
          version="${release_version#v}"
          IFS=. read -r major minor _patch <<< "$version"
          development_version="v${major}.$((minor + 1)).0-DEV"
          echo "version=${development_version}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish development image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shanebionic/palcenter:dev
            ghcr.io/shanebionic/palcenter:dev-${{ github.sha }}
          build-args: |
            PALCENTER_VERSION=${{ steps.build.outputs.version }}
            PALCENTER_CHANNEL=development
            PALCENTER_COMMIT=${{ steps.build.outputs.commit }}
          cache-from: type=registry,ref=ghcr.io/shanebionic/palcenter:dev
          cache-to: type=inline
