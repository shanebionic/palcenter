name: Development Docker Image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/shanebionic/palcenter

jobs:
  prepare:
    name: Verify development publication
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.build.outputs.version }}
      commit: ${{ steps.build.outputs.commit }}

    steps:
      - name: Require dev branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/dev" ]]; then
            echo "::error::Development images may only be published from the dev branch."
            exit 1
          fi

      - name: Require successful validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..80}; do
            validation="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow validation.yml \
                --branch dev \
                --commit "${GITHUB_SHA}" \
                --event push \
                --limit 1 \
                --json status,conclusion
            )"
            status="$(jq -r '.[0].status // "pending"' <<< "${validation}")"
            conclusion="$(jq -r '.[0].conclusion // ""' <<< "${validation}")"

            if [[ "${status}" == "completed" && "${conclusion}" == "success" ]]; then
              echo "Validation succeeded for ${GITHUB_SHA}."
              exit 0
            fi
            if [[ "${status}" == "completed" ]]; then
              echo "::error::Validation completed with '${conclusion}' for ${GITHUB_SHA}; the development image will not be published."
              exit 1
            fi

            echo "Waiting for Validation (${status}, attempt ${attempt}/80)..."
            sleep 15
          done

          echo "::error::Timed out waiting for Validation to complete for ${GITHUB_SHA}."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate development build metadata
        id: build
        shell: bash
        run: |
          release_version="$(git tag --list 'v*.*.*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [[ -z "$release_version" ]]; then
            release_version="v$(node -p "require('./package.json').version")"
          fi
          version="${release_version#v}"
          IFS=. read -r major minor _patch <<< "$version"
          development_version="v${major}.$((minor + 1)).0-DEV"
          echo "version=${development_version}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build development image (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: type=raw,value=dev
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push development image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            PALCENTER_VERSION=${{ needs.prepare.outputs.version }}
            PALCENTER_CHANNEL=development
            PALCENTER_COMMIT=${{ needs.prepare.outputs.commit }}
          cache-from: |
            type=gha,scope=palcenter-publish-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY_IMAGE }}:dev
          cache-to: type=gha,scope=palcenter-publish-${{ matrix.arch }},mode=max
          provenance: mode=max

      - name: Export image digest
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: development-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish development manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: development-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform development manifest
        shell: bash
        run: |
          sources=()
          for digest in "${RUNNER_TEMP}"/digests/*; do
            sources+=("${REGISTRY_IMAGE}@sha256:$(basename "${digest}")")
          done

          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:dev" \
            --tag "${REGISTRY_IMAGE}:dev-${GITHUB_SHA}" \
            "${sources[@]}"

      - name: Verify published platforms
        shell: bash
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:dev"
